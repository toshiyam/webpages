<!doctype html>
<!--
name: シフトライン司令室
version: 0.9
type: single-html-app
status: review
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>シフトライン司令室</title>
  <style>
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0; padding: 16px; background: #f6f7f9; color: #20242a;
      padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      overflow-wrap: anywhere;
    }
    main { max-width: 1200px; margin: 0 auto; }
    .card {
      background: #fff; border: 1px solid #dde2ea; border-radius: 14px;
      padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.04); margin-bottom: 16px;
    }
    h1 { margin-top: 0; }
    h2 { font-size: 1.2em; margin: 16px 0 12px; }
    h3 { font-size: 1em; margin: 12px 0 8px; }
    button {
      padding: 12px 16px; font-size: 1em; border: 1px solid #dde2ea;
      border-radius: 8px; background: #fff; cursor: pointer;
      transition: all 0.2s; margin-right: 8px; margin-bottom: 8px;
    }
    button:hover { background: #f0f1f3; border-color: #20242a; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    button.primary:hover { background: #1d4ed8; }
    button.danger { background: #dc2626; color: #fff; border-color: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button.success { background: #16a34a; color: #fff; border-color: #16a34a; }
    button.success:hover { background: #15803d; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .status-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr));
      gap: 12px; margin-bottom: 16px;
    }
    .status-item { padding: 12px; background: #f9fafb; border-radius: 8px; min-width: 0; }
    .status-label {
      font-size: 0.85em; color: #6b7280; margin-bottom: 4px;
      white-space: nowrap; word-break: keep-all; overflow: hidden; text-overflow: ellipsis;
    }
    .status-value { font-size: 1.5em; font-weight: bold; white-space: nowrap; }
    .lines-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
      gap: 16px; margin-bottom: 16px;
    }
    .line-card {
      border: 2px solid #dde2ea; border-radius: 12px; padding: 16px;
      background: #fff; min-width: 0;
    }
    .line-card h3 { margin-top: 0; }
    .line-stat {
      display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr);
      align-items: center; column-gap: 12px; padding: 10px 0;
      border-bottom: 1px solid #efefef; font-size: 0.95em;
    }
    .line-stat:last-child { border-bottom: none; }
    .line-stat > span:first-child {
      white-space: nowrap; word-break: keep-all; color: #4b5563;
    }
    .line-stat > span:last-child {
      text-align: right; white-space: nowrap; font-weight: 600; min-width: 0;
    }
    .progress-bar {
      width: 100%; height: 24px; background: #e5e7eb; border-radius: 8px;
      overflow: hidden; margin: 8px 0;
    }
    .progress-fill {
      height: 100%; background: #3b82f6; transition: width 0.3s;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.75em; font-weight: bold;
    }
    .risk-low { color: #16a34a; }
    .risk-medium { color: #f59e0b; }
    .risk-high { color: #dc2626; }
    .status-safe { color: #16a34a; }
    .status-warning { color: #f59e0b; }
    .status-critical { color: #dc2626; }
    .allocation-controls {
      margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;
    }
    .allocation-input {
      padding: 8px 10px; border: 1px solid #dde2ea; border-radius: 6px;
      width: 100%; max-width: 100px; min-height: 44px; font-size: 16px;
      text-align: center; justify-self: end;
    }
    .event-log {
      max-height: 400px; overflow-y: auto; background: #f9fafb;
      border-radius: 8px; padding: 12px; font-size: 0.9em;
    }
    .event-item {
      padding: 8px; border-left: 3px solid #dde2ea; margin-bottom: 8px;
      padding-left: 12px;
    }
    .event-turn { font-weight: bold; margin-bottom: 4px; }
    .event-text { color: #4b5563; }
    .result-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: none; align-items: center;
      justify-content: center; z-index: 1000; padding: 12px;
    }
    .result-modal.active { display: flex; }
    .result-content {
      background: #fff; padding: 32px; border-radius: 16px;
      width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
    }
    .result-score { font-size: 2em; font-weight: bold; margin: 16px 0; }
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .result-item { padding: 12px; background: #f9fafb; border-radius: 8px; min-width: 0; overflow-wrap: anywhere; }
    .result-item-label { font-size: 0.85em; color: #6b7280; }
    .result-item-value { font-size: 1.2em; font-weight: bold; margin-top: 4px; }
    .result-item-wide { grid-column: 1 / -1; }
    .result-item-value.small { font-size: 0.95em; line-height: 1.5; }
    input[type="number"] { padding: 8px; border: 1px solid #dde2ea; border-radius: 6px; }
    .hidden { display: none; }
    .event-bad { border-left-color: #dc2626; }
    .event-good { border-left-color: #16a34a; }
    .notice {
      background: #fef3c7; border: 1px solid #f59e0b; color: #78350f;
      border-radius: 10px; padding: 12px; margin-bottom: 16px;
    }
    .notice button { margin: 8px 0 0; }
    .end-banner {
      background: #fff7ed; border: 2px solid #f97316; border-radius: 14px;
      padding: 16px; margin-bottom: 16px;
    }
    .end-banner strong { display: block; font-size: 1.1em; margin-bottom: 8px; }
    .decision-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
      gap: 12px; margin: 12px 0;
    }
    .decision-card {
      border: 2px solid #dde2ea; border-radius: 12px; padding: 14px;
      background: #fff; min-width: 0;
    }
    .decision-card.selected { border-color: #2563eb; background: #eff6ff; }
    .decision-card h3 { margin-top: 0; }
    .decision-card p { margin: 6px 0; font-size: 0.92em; line-height: 1.5; }
    .decision-preview {
      background: #f9fafb; border-radius: 8px; padding: 8px 10px;
      font-size: 0.88em; line-height: 1.6; margin: 8px 0;
    }
    .decision-card button { width: 100%; margin-right: 0; min-height: 44px; }
    .decision-record { font-size: 0.9em; line-height: 1.6; color: #374151; }
    @media (max-width: 600px) {
      body { padding: 12px; padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
      .status-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .lines-grid { grid-template-columns: minmax(0, 1fr); }
      .decision-grid { grid-template-columns: minmax(0, 1fr); }
      .result-grid { grid-template-columns: minmax(0, 1fr); }
      .result-content { padding: 20px; }
      button { padding: 12px 16px; font-size: 1em; min-height: 44px; }
      .line-stat { grid-template-columns: minmax(0, auto) minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <div id="notice" class="notice hidden" role="alert">
      <div id="noticeText"></div>
      <button id="btnCloseNotice">閉じる</button>
    </div>

    <section class="card">
      <h1>シフトライン司令室</h1>
      <p>複数ラインの人員と進捗を管理し、シフト目標達成を目指します。</p>

      <div class="btn-group">
        <button id="btnStart" class="primary">シフト開始</button>
        <button id="btnNextTurn" class="success" disabled>次のターン</button>
        <button id="btnEndShift" class="danger" disabled>シフト終了</button>
        <button id="btnReset">リセット</button>
        <button id="btnHistory">履歴</button>
      </div>
    </section>

    <section id="historyPanel" class="card hidden">
      <h2>シフト履歴</h2>
      <div class="status-bar" id="historySummary"></div>
      <div id="historyList"></div>
      <div class="btn-group">
        <button id="btnClearHistory" class="danger">履歴を全削除</button>
        <button id="btnCloseHistory">閉じる</button>
      </div>
    </section>

    <section id="shiftPanel" class="hidden">
      <div id="endBanner" class="end-banner hidden">
        <strong>16ターンが終了しました。終了判断へ進んでください。</strong>
        <div>次のターンへは進めません。下の判断から1つ選んで確定すると結果が出ます。</div>
        <button id="btnGoDecision" class="primary">終了判断へ進む</button>
      </div>

      <section id="decisionPanel" class="card hidden"></section>

      <section class="card">
        <h2>シフト情報</h2>
        <div class="status-bar">
          <div class="status-item">
            <div class="status-label">経過時間</div>
            <div class="status-value" id="currentTime">8:00</div>
          </div>
          <div class="status-item">
            <div class="status-label">総人員</div>
            <div class="status-value" id="totalStaff">20 人</div>
          </div>
          <div class="status-item">
            <div class="status-label">配置済人員</div>
            <div class="status-value" id="allocatedStaff">0 人</div>
          </div>
          <div class="status-item">
            <div class="status-label">全体進捗</div>
            <div class="status-value" id="overallProgress">0%</div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>生産ライン</h2>
        <div class="lines-grid" id="linesContainer"></div>
      </section>

      <section class="card">
        <h2>アクション</h2>
        <button id="btnEvent" class="primary">ランダムイベント発生</button>
        <button id="btnRest">疲労リセット</button>
      </section>

      <section class="card">
        <h2>イベントログ</h2>
        <div class="event-log" id="eventLog"></div>
      </section>
    </section>

    <div id="resultModal" class="result-modal">
      <div class="result-content">
        <h2>シフト結果</h2>
        <div class="result-score" id="resultScore"></div>
        <div class="result-grid" id="resultDetails"></div>
        <div class="btn-group">
          <button class="primary" onclick="closeResult()">閉じる</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    'use strict';

    const STORAGE_KEY = 'shiftLineDispatcher_v0.2';
    const LINES = [
      { id: 'line1', name: '第1ライン', target: 100, baseSpeed: 15, requiredStaff: 8 },
      { id: 'line2', name: '第2ライン', target: 80, baseSpeed: 12, requiredStaff: 7 },
      { id: 'line3', name: '第3ライン', target: 60, baseSpeed: 18, requiredStaff: 5 }
    ];
    const TOTAL_STAFF = 20;
    const SHIFT_HOURS = 8;
    const TURNS_PER_SHIFT = 16; // 30分ごと
    const TURN_DURATION_MIN = 30;

    // 終了判断のルール。表示（プレビュー）と実処理の両方がここを参照する。
    //   target: 'none' = 対象なし / 'unfinished' = 未達ライン / 'all' = 全ライン
    //   gain: 対象ラインの完了数の増加上限（目標数が上限）
    //   fatigue: 対象ラインの疲労増減（0〜100に収める）
    //   scoreCost: 最終スコアから引く点数（スコアは0〜100に収める）
    const DECISIONS = {
      ontime: {
        label: '定時終了', target: 'none', gain: 0, fatigue: 0, scoreCost: 0,
        effect: '現在の状態のまま評価を確定します。',
        cost: '代償はありません。未達ラインはそのまま評価されます。'
      },
      overtime: {
        label: '残業・延長対応', target: 'unfinished', gain: 12, fatigue: 15, scoreCost: 0,
        effect: '未達ラインの完了数を最大 +12 します（目標数まで）。',
        cost: '対象ラインの疲労が +15 されます。'
      },
      support: {
        label: '応援要請', target: 'unfinished', gain: 8, fatigue: 0, scoreCost: 6,
        effect: '未達ラインの完了数を最大 +8 します（目標数まで）。',
        cost: '応援コストとしてスコアが -6 点されます。'
      },
      safety: {
        label: '安全優先で終了', target: 'all', gain: 0, fatigue: -25, scoreCost: 0,
        effect: '全ラインの疲労を -25 します（0%まで）。完了数は増えません。',
        cost: '未達ラインの完了数は増えません。'
      }
    };
    const DECISION_ORDER = ['ontime', 'overtime', 'support', 'safety'];

    function makeLines() {
      const lines = {};
      const staff = {};
      LINES.forEach(line => {
        lines[line.id] = { completed: 0, wip: 0, fatigue: 0, shortage: false };
        staff[line.id] = 0;
      });
      return { lines, staff };
    }

    function freshState() {
      const base = makeLines();
      return {
        shiftActive: false,
        turn: 0,
        startTime: 8 * 60,
        lines: base.lines,
        staff: base.staff,
        history: [],
        shiftResults: [],
        allocated: 0
      };
    }

    let state = freshState();

    // 画面だけの一時状態（保存しない）
    const ui = { decisionOpen: false, selected: null };

    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    function sgn(n) {
      return n > 0 ? `+${n}` : n < 0 ? `${n}` : '±0';
    }

    function showNotice(text) {
      const box = document.getElementById('notice');
      if (!box) return;
      document.getElementById('noticeText').textContent = text;
      box.classList.remove('hidden');
    }

    function initLines() {
      const base = makeLines();
      state.lines = base.lines;
      state.staff = base.staff;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch(e) {
        console.error('Save failed:', e);
        showNotice('保存に失敗しました。このまま続けられますが、リロードすると進行状況が失われる場合があります。');
      }
    }

    function loadState() {
      let saved = null;
      try {
        saved = localStorage.getItem(STORAGE_KEY);
      } catch(e) {
        console.error('Load failed:', e);
        showNotice('保存データを読み込めませんでした。初期状態で開始します。');
        return false;
      }
      if (saved === null) return false;

      let loaded = null;
      try {
        loaded = JSON.parse(saved);
      } catch(e) {
        console.error('Parse failed:', e);
      }
      if (loaded && validateState(loaded)) {
        state = loaded;
        return true;
      }

      state = freshState();
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch(e) {
        console.error('Cleanup failed:', e);
      }
      showNotice('保存データが壊れていたため、初期状態に戻しました。');
      return false;
    }

    function isFiniteNumber(v) {
      return typeof v === 'number' && Number.isFinite(v);
    }

    function validateDecisionRecord(d) {
      if (!d || typeof d !== 'object') return false;
      if (typeof d.id !== 'string' || !Object.prototype.hasOwnProperty.call(DECISIONS, d.id)) return false;
      if (!isFiniteNumber(d.completedGain) || d.completedGain < 0 || d.completedGain > 1000) return false;
      if (!isFiniteNumber(d.fatigueBefore) || d.fatigueBefore < 0 || d.fatigueBefore > 100) return false;
      if (!isFiniteNumber(d.fatigueAfter) || d.fatigueAfter < 0 || d.fatigueAfter > 100) return false;
      if (!isFiniteNumber(d.scoreBefore) || d.scoreBefore < 0 || d.scoreBefore > 100) return false;
      if (!isFiniteNumber(d.scoreCost) || d.scoreCost < 0 || d.scoreCost > 100) return false;
      return true;
    }

    function validateState(obj) {
      if (!obj || typeof obj !== 'object') return false;
      if (typeof obj.shiftActive !== 'boolean') return false;
      if (!isFiniteNumber(obj.turn) || obj.turn < 0 || obj.turn > TURNS_PER_SHIFT) return false;
      if (!isFiniteNumber(obj.startTime) || obj.startTime < 0) return false;
      if (!isFiniteNumber(obj.allocated) || obj.allocated < 0 || obj.allocated > TOTAL_STAFF) return false;

      if (!obj.lines || typeof obj.lines !== 'object') return false;
      if (!obj.staff || typeof obj.staff !== 'object') return false;

      let staffSum = 0;
      for (const line of LINES) {
        const ls = obj.lines[line.id];
        if (!ls || typeof ls !== 'object') return false;
        if (!isFiniteNumber(ls.completed) || ls.completed < 0) return false;
        if (!isFiniteNumber(ls.wip) || ls.wip < 0) return false;
        if (!isFiniteNumber(ls.fatigue) || ls.fatigue < 0 || ls.fatigue > 100) return false;
        if (typeof ls.shortage !== 'boolean') return false;

        const st = obj.staff[line.id];
        if (!isFiniteNumber(st) || st < 0 || st > TOTAL_STAFF) return false;
        staffSum += st;
      }
      if (staffSum > TOTAL_STAFF) return false;

      if (!Array.isArray(obj.history)) return false;
      for (const h of obj.history) {
        if (!h || typeof h !== 'object') return false;
        if (!isFiniteNumber(h.turn) || typeof h.text !== 'string') return false;
      }

      if (!Array.isArray(obj.shiftResults)) return false;
      for (const r of obj.shiftResults) {
        if (!r || typeof r !== 'object') return false;
        if (!isFiniteNumber(r.achievement) || !isFiniteNumber(r.avgFatigue) || !isFiniteNumber(r.score)) return false;
        // 旧履歴には decision がない。ある場合のみ検証する。
        if (r.decision !== undefined && !validateDecisionRecord(r.decision)) return false;
      }

      return true;
    }

    function isDecisionPhase() {
      return state.shiftActive && (state.turn >= TURNS_PER_SHIFT || ui.decisionOpen);
    }

    function startShift() {
      initLines();
      state.shiftActive = true;
      state.turn = 0;
      state.startTime = 8 * 60;
      state.history = [];
      state.allocated = 0;
      ui.decisionOpen = false;
      ui.selected = null;

      addLog('シフト開始！ 頑張りましょう。');
      saveState();
      render();
    }

    function nextTurn() {
      if (!state.shiftActive) return;
      if (state.turn >= TURNS_PER_SHIFT) return;
      if (isDecisionPhase()) return;

      state.turn++;

      // Process each line
      LINES.forEach(line => {
        const lineState = state.lines[line.id];
        const allocated = state.staff[line.id] || 0;
        const ratio = line.requiredStaff > 0 ? allocated / line.requiredStaff : 0;

        // Calculate production: understaffing hurts progress, overstaffing gives
        // only a small bonus but drives fatigue up faster.
        let productivity;
        if (ratio < 0.5) {
          productivity = ratio * 0.5;
        } else if (ratio <= 1) {
          productivity = ratio;
        } else {
          productivity = 1 + Math.min(ratio - 1, 1) * 0.15;
        }

        let production = Math.floor(line.baseSpeed * productivity);

        // Shortage in progress cripples production until resolved.
        if (lineState.shortage) {
          production = Math.floor(production * 0.4);
          if (Math.random() < 0.3) {
            lineState.shortage = false;
            addLog(`${line.name}の欠品が解消されました。`);
          }
        } else if (Math.random() < 0.12) {
          lineState.shortage = true;
          addLog(`⚠️ ${line.name}で部品欠品が発生！`);
        }

        lineState.completed += production;
        lineState.wip = Math.max(0, lineState.wip + allocated - production);

        // Fatigue: overwork increases it fastest, understaffed stress adds a
        // little, adequate staffing still accrues a small baseline per turn.
        if (ratio > 1) {
          lineState.fatigue += Math.round((ratio - 1) * 20);
        } else if (ratio < 1) {
          lineState.fatigue += Math.round((1 - ratio) * 5);
        } else {
          lineState.fatigue += 1;
        }
        lineState.fatigue = Math.max(0, Math.min(100, lineState.fatigue));
      });

      if (state.turn >= TURNS_PER_SHIFT) {
        addLog('16ターンが終了しました。終了判断を選んでください。');
      }

      saveState();
      render();
    }

    // 「シフト終了」操作は常に終了判断画面へ接続する。
    function endShift() {
      if (!state.shiftActive) return;
      ui.decisionOpen = true;
      render();
      scrollToDecision();
    }

    function scrollToDecision() {
      const panel = document.getElementById('decisionPanel');
      if (panel && typeof panel.scrollIntoView === 'function') {
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function cancelDecision() {
      if (state.turn >= TURNS_PER_SHIFT) return;
      ui.decisionOpen = false;
      ui.selected = null;
      render();
    }

    // lines: { [lineId]: { completed, fatigue } }。副作用なし。
    function calculateResults(lines, scoreCost) {
      const results = {
        achievement: 0,
        totalTarget: 0,
        totalCompleted: 0,
        avgFatigue: 0,
        riskLabel: '低',
        shortageCount: 0,
        rawScore: 0,
        score: 0,
        turns: state.turn,
        timestamp: new Date().toISOString()
      };

      let totalFatigue = 0;
      LINES.forEach(line => {
        results.totalTarget += line.target;
        const completed = Math.min(lines[line.id].completed, line.target);
        results.totalCompleted += completed;
        totalFatigue += lines[line.id].fatigue;
      });

      results.achievement = Math.round((results.totalCompleted / results.totalTarget) * 100);
      results.avgFatigue = Math.round(totalFatigue / LINES.length);
      results.riskLabel = results.avgFatigue > 70 ? '高' : results.avgFatigue > 40 ? '中' : '低';
      results.shortageCount = state.history.filter(h => h.text.includes('欠品が発生')).length;

      const safetyMargin = Math.max(0, 100 - results.avgFatigue);
      const shortagePenalty = Math.max(0, 100 - results.shortageCount * 10);
      results.rawScore = Math.round((results.achievement * 0.5) + (safetyMargin * 0.3) + (shortagePenalty * 0.2));
      results.score = clamp(results.rawScore - (scoreCost || 0), 0, 100);

      return results;
    }

    // 判断の効果を現在の状態から計算する。状態は変更しない。
    // プレビュー表示と確定処理の両方がこの結果を使う。
    function computeDecision(id) {
      const rule = DECISIONS[id];
      const current = calculateResults(state.lines, 0);
      const afterLines = {};
      const perLine = [];
      let totalGain = 0;

      LINES.forEach(line => {
        const ls = state.lines[line.id];
        const unfinished = ls.completed < line.target;
        const targeted = rule.target === 'all' || (rule.target === 'unfinished' && unfinished);
        let gain = 0;
        let newFatigue = ls.fatigue;
        if (targeted) {
          gain = Math.max(0, Math.min(rule.gain, line.target - ls.completed));
          newFatigue = clamp(ls.fatigue + rule.fatigue, 0, 100);
        }
        afterLines[line.id] = { completed: ls.completed + gain, fatigue: newFatigue };
        totalGain += gain;
        perLine.push({
          id: line.id,
          name: line.name,
          gain: gain,
          fatigueBefore: ls.fatigue,
          fatigueAfter: newFatigue,
          fatigueDelta: newFatigue - ls.fatigue
        });
      });

      const results = calculateResults(afterLines, rule.scoreCost);
      const scoreCost = results.rawScore - results.score;
      return {
        id: id,
        label: rule.label,
        perLine: perLine,
        afterLines: afterLines,
        totalGain: totalGain,
        current: current,
        results: results,
        scoreCost: scoreCost
      };
    }

    function previewHtml(out) {
      const changes = out.perLine.filter(p => p.gain !== 0 || p.fatigueDelta !== 0);
      const lineText = changes.length === 0
        ? '変化するラインはありません。'
        : changes.map(p => `${p.name}: 完了 ${sgn(p.gain)} / 疲労 ${sgn(p.fatigueDelta)}`).join('<br>');
      const costText = out.scoreCost > 0 ? `（コスト -${out.scoreCost}）` : '';
      return `
        <div class="decision-preview">
          <div>現在の状態での見込み</div>
          <div>${lineText}</div>
          <div>完了数 ${out.current.totalCompleted}→${out.results.totalCompleted} / 達成率 ${out.current.achievement}%→${out.results.achievement}%</div>
          <div>平均疲労 ${out.current.avgFatigue}%→${out.results.avgFatigue}%</div>
          <div>スコア ${out.current.score}→${out.results.score}点${costText}</div>
        </div>
      `;
    }

    function renderDecisionPanel() {
      const panel = document.getElementById('decisionPanel');
      if (!isDecisionPhase()) {
        panel.classList.add('hidden');
        panel.innerHTML = '';
        return;
      }
      panel.classList.remove('hidden');
      const forced = state.turn >= TURNS_PER_SHIFT;

      const cards = DECISION_ORDER.map(id => {
        const rule = DECISIONS[id];
        const out = computeDecision(id);
        const selected = ui.selected === id;
        return `
          <div class="decision-card ${selected ? 'selected' : ''}">
            <h3>${rule.label}</h3>
            <p><strong>効果:</strong> ${rule.effect}</p>
            <p><strong>代償:</strong> ${rule.cost}</p>
            ${previewHtml(out)}
            <button class="${selected ? 'primary' : ''}" data-action="select" data-decision="${id}">${selected ? '選択中' : 'この判断を選ぶ'}</button>
          </div>
        `;
      }).join('');

      panel.innerHTML = `
        <h2>終了判断</h2>
        <p>${forced ? '16ターンが終了しました。' : 'シフトを終了します。'}判断を1つ選んで確定してください。確定すると結果が記録されます。</p>
        <div class="decision-grid">${cards}</div>
        <div class="btn-group">
          <button class="success" data-action="confirm" ${DECISIONS[ui.selected] ? '' : 'disabled'}>この判断で確定</button>
          ${forced ? '' : '<button data-action="cancel">戻る</button>'}
        </div>
      `;
    }

    function confirmDecision() {
      // 二重適用防止: 判断待ちでなければ何もしない
      if (!isDecisionPhase()) return;
      const id = ui.selected;
      if (typeof id !== 'string' || !Object.prototype.hasOwnProperty.call(DECISIONS, id)) return;

      const out = computeDecision(id);
      // 最初にシフトを閉じて、連打・再描画での再実行を防ぐ
      state.shiftActive = false;
      ui.decisionOpen = false;
      ui.selected = null;

      LINES.forEach(line => {
        state.lines[line.id].completed = out.afterLines[line.id].completed;
        state.lines[line.id].fatigue = out.afterLines[line.id].fatigue;
      });

      const record = out.results;
      delete record.rawScore;
      record.decision = {
        id: id,
        completedGain: out.totalGain,
        fatigueBefore: out.current.avgFatigue,
        fatigueAfter: out.results.avgFatigue,
        scoreBefore: out.current.score,
        scoreCost: out.scoreCost
      };

      addLog(`終了判断「${out.label}」を確定。完了数 ${sgn(out.totalGain)} / 平均疲労 ${out.current.avgFatigue}%→${out.results.avgFatigue}% / スコア ${out.current.score}→${out.results.score}点（コスト -${out.scoreCost}）`);
      state.shiftResults.push(record);

      saveState();
      render();
      showResults(record);
    }

    function decisionSummaryHtml(r) {
      if (!r.decision) return '判断記録なし';
      const d = r.decision;
      const rule = DECISIONS[d.id];
      const costText = d.scoreCost > 0 ? ` / スコアコスト -${d.scoreCost}` : '';
      return `判断: ${rule.label}<br>完了数 ${sgn(d.completedGain)} / 平均疲労 ${d.fatigueBefore}%→${d.fatigueAfter}% / スコア ${d.scoreBefore}→${r.score}点${costText}`;
    }

    function showResults(results) {
      const modal = document.getElementById('resultModal');
      const scoreDiv = document.getElementById('resultScore');
      const detailsDiv = document.getElementById('resultDetails');

      scoreDiv.textContent = `スコア: ${results.score} 点`;
      detailsDiv.innerHTML = `
        <div class="result-item result-item-wide">
          <div class="result-item-label">終了判断</div>
          <div class="result-item-value small">${decisionSummaryHtml(results)}</div>
        </div>
        <div class="result-item">
          <div class="result-item-label">達成率</div>
          <div class="result-item-value">${results.achievement}%</div>
        </div>
        <div class="result-item">
          <div class="result-item-label">完了数/目標数</div>
          <div class="result-item-value">${results.totalCompleted}/${results.totalTarget}</div>
        </div>
        <div class="result-item">
          <div class="result-item-label">平均疲労度</div>
          <div class="result-item-value">${results.avgFatigue}%</div>
        </div>
        <div class="result-item">
          <div class="result-item-label">事故リスク</div>
          <div class="result-item-value">${results.riskLabel}</div>
        </div>
        <div class="result-item">
          <div class="result-item-label">欠品発生</div>
          <div class="result-item-value">${results.shortageCount} 回</div>
        </div>
      `;

      modal.classList.add('active');
    }

    function closeResult() {
      document.getElementById('resultModal').classList.remove('active');
    }

    function generateEvent() {
      if (!state.shiftActive || isDecisionPhase()) return;
      const events = [
        () => {
          const line = LINES[Math.floor(Math.random() * LINES.length)];
          const reduction = Math.min(state.staff[line.id] || 0, Math.floor(Math.random() * 3) + 1);
          state.staff[line.id] -= reduction;
          state.allocated = Math.max(0, state.allocated - reduction);
          if (reduction > 0) {
            addLog(`⚠️ ${line.name}の一部作業者が休職。(-${reduction}人)`);
          }
        },
        () => {
          const line = LINES[Math.floor(Math.random() * LINES.length)];
          const support = Math.min(3, TOTAL_STAFF - state.allocated);
          if (support > 0) {
            state.staff[line.id] += support;
            state.allocated += support;
            addLog(`✨ ${line.name}に応援投入！ +${support}人`);
          }
        },
        () => {
          const line = LINES[Math.floor(Math.random() * LINES.length)];
          state.lines[line.id].completed += Math.floor(Math.random() * 10) + 5;
          addLog(`🎉 ${line.name}で改善提案が活かされた！`);
        },
        () => {
          const line = LINES[Math.floor(Math.random() * LINES.length)];
          state.lines[line.id].wip = Math.max(0, state.lines[line.id].wip - 10);
          addLog(`😰 ${line.name}で工具トラブル。進捗が停滞。`);
        }
      ];

      events[Math.floor(Math.random() * events.length)]();
      saveState();
      render();
    }

    function allocateStaff() {
      const values = {};
      let total = 0;

      for (const line of LINES) {
        const raw = document.getElementById(`staff_${line.id}`).value.trim();

        if (raw === '') {
          alert(`${line.name}の人員数を入力してください。`);
          return;
        }

        const num = Number(raw);

        if (!Number.isFinite(num)) {
          alert(`${line.name}の人員数が不正な値です。`);
          return;
        }
        if (!Number.isInteger(num)) {
          alert(`${line.name}の人員数は整数で入力してください。`);
          return;
        }
        if (num < 0) {
          alert(`${line.name}の人員数は0以上にしてください。`);
          return;
        }
        if (num > TOTAL_STAFF) {
          alert(`${line.name}の人員数が総人員(${TOTAL_STAFF}人)を超えています。`);
          return;
        }

        values[line.id] = num;
        total += num;
      }

      if (total > TOTAL_STAFF) {
        alert(`配置人員合計(${total}人)が総人員(${TOTAL_STAFF}人)を超えています。`);
        return;
      }

      LINES.forEach(line => {
        state.staff[line.id] = values[line.id];
      });

      state.allocated = total;
      addLog(`人員を配置しました。 (合計: ${total}人)`);
      saveState();
      render();
    }

    function resetFatigue() {
      if (!state.shiftActive || isDecisionPhase()) return;
      LINES.forEach(line => {
        state.lines[line.id].fatigue = 0;
      });
      addLog('全ラインの疲労をリセット。');
      saveState();
      render();
    }

    function addLog(text) {
      state.history.push({
        turn: state.turn,
        text: text,
        timestamp: Date.now()
      });
      if (state.history.length > 50) {
        state.history.shift();
      }
    }

    function resetAll() {
      if (confirm('すべてのデータをリセットしますか？')) {
        state = freshState();
        ui.decisionOpen = false;
        ui.selected = null;
        saveState();
        render();
      }
    }

    function formatTime(minutes) {
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;
      return `${hours}:${mins.toString().padStart(2, '0')}`;
    }

    function render() {
      const shiftPanel = document.getElementById('shiftPanel');
      const btnStart = document.getElementById('btnStart');
      const btnNextTurn = document.getElementById('btnNextTurn');
      const btnEndShift = document.getElementById('btnEndShift');

      if (state.shiftActive) {
        const deciding = isDecisionPhase();
        shiftPanel.classList.remove('hidden');
        btnStart.disabled = true;
        btnNextTurn.disabled = deciding || state.turn >= TURNS_PER_SHIFT;
        btnEndShift.disabled = false;
        document.getElementById('btnEvent').disabled = deciding;
        document.getElementById('btnRest').disabled = deciding;
        document.getElementById('endBanner').classList.toggle('hidden', state.turn < TURNS_PER_SHIFT);

        document.getElementById('currentTime').textContent = formatTime(state.startTime + (state.turn * TURN_DURATION_MIN));
        document.getElementById('totalStaff').textContent = `${TOTAL_STAFF} 人`;
        document.getElementById('allocatedStaff').textContent = `${state.allocated} 人`;

        let totalProgress = 0;
        let totalTarget = 0;
        LINES.forEach(line => {
          totalTarget += line.target;
          totalProgress += Math.min(state.lines[line.id].completed, line.target);
        });
        const progressPct = Math.round((totalProgress / totalTarget) * 100);
        document.getElementById('overallProgress').textContent = `${progressPct}%`;

        renderDecisionPanel();
        renderLines();
        renderEventLog();
      } else {
        shiftPanel.classList.add('hidden');
        btnStart.disabled = false;
        btnNextTurn.disabled = true;
        btnEndShift.disabled = true;
      }
    }

    function renderLines() {
      const container = document.getElementById('linesContainer');
      container.innerHTML = '';

      LINES.forEach(line => {
        const lineState = state.lines[line.id];
        const progressPct = Math.round((lineState.completed / line.target) * 100);
        const fatigueClass = lineState.fatigue > 70 ? 'risk-high' : lineState.fatigue > 40 ? 'risk-medium' : 'risk-low';
        const shortageClass = lineState.shortage ? 'status-critical' : 'status-safe';

        const html = `
          <div class="line-card">
            <h3>${line.name}</h3>
            <div class="line-stat">
              <span>目標数</span>
              <span>${line.target}</span>
            </div>
            <div class="line-stat">
              <span>完了数</span>
              <span>${Math.min(lineState.completed, line.target)}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${Math.min(progressPct, 100)}%">${Math.min(progressPct, 100)}%</div>
            </div>
            <div class="line-stat">
              <span>仕掛品</span>
              <span>${lineState.wip}</span>
            </div>
            <div class="line-stat">
              <span>必要人員</span>
              <span>${line.requiredStaff} 人</span>
            </div>
            <div class="line-stat">
              <span>配置人員</span>
              <span><input type="number" id="staff_${line.id}" class="allocation-input" value="${state.staff[line.id] || 0}" min="0" max="${TOTAL_STAFF}" step="1"></span>
            </div>
            <div class="line-stat">
              <span>疲労度</span>
              <span class="${fatigueClass}">${lineState.fatigue}%</span>
            </div>
            <div class="line-stat">
              <span>欠品</span>
              <span class="${shortageClass}">${lineState.shortage ? '発生中' : '正常'}</span>
            </div>
          </div>
        `;
        container.innerHTML += html;
      });

      // Add allocation button
      const allocBtn = document.createElement('div');
      allocBtn.style.gridColumn = '1 / -1';
      allocBtn.innerHTML = '<button class="primary" onclick="allocateStaff()">人員配置を確定</button>';
      container.appendChild(allocBtn);
    }

    function renderEventLog() {
      const container = document.getElementById('eventLog');
      const recentLogs = state.history.slice(-15).reverse();

      container.innerHTML = recentLogs.map(log => {
        const isBad = log.text.includes('⚠️') || log.text.includes('😰');
        const isGood = log.text.includes('✨') || log.text.includes('🎉');
        const cls = isBad ? 'event-bad' : isGood ? 'event-good' : '';
        return `
          <div class="event-item ${cls}">
            <div class="event-turn">ターン ${log.turn}</div>
            <div class="event-text">${log.text}</div>
          </div>
        `;
      }).join('');
    }

    function toggleHistory() {
      const panel = document.getElementById('historyPanel');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) {
        renderHistoryPanel();
      }
    }

    function renderHistoryPanel() {
      const summary = document.getElementById('historySummary');
      const list = document.getElementById('historyList');
      const results = state.shiftResults;
      const count = results.length;
      const avgAchievement = count ? Math.round(results.reduce((sum, r) => sum + r.achievement, 0) / count) : 0;
      const bestScore = count ? Math.max(...results.map(r => r.score)) : 0;

      summary.innerHTML = `
        <div class="status-item">
          <div class="status-label">累計シフト数</div>
          <div class="status-value">${count}</div>
        </div>
        <div class="status-item">
          <div class="status-label">平均達成率</div>
          <div class="status-value">${avgAchievement}%</div>
        </div>
        <div class="status-item">
          <div class="status-label">最高スコア</div>
          <div class="status-value">${bestScore}</div>
        </div>
      `;

      if (count === 0) {
        list.innerHTML = '<p>シフト履歴がまだありません。</p>';
        return;
      }

      list.innerHTML = results.map((r, idx) => {
        const date = new Date(r.timestamp);
        const dateLabel = isNaN(date.getTime()) ? '' : date.toLocaleString('ja-JP');
        const risk = typeof r.riskLabel === 'string' ? r.riskLabel : '-';
        const shortage = isFiniteNumber(r.shortageCount) ? r.shortageCount : 0;
        return `
          <div class="event-item">
            <div class="event-turn">${dateLabel} - スコア ${r.score}点</div>
            <div class="event-text">達成率 ${r.achievement}% / 疲労 ${r.avgFatigue}% / リスク ${risk} / 欠品 ${shortage}回</div>
            <div class="decision-record">${decisionSummaryHtml(r)}</div>
            <button class="danger" onclick="deleteHistoryEntry(${idx})">この記録を削除</button>
          </div>
        `;
      }).reverse().join('');
    }

    function deleteHistoryEntry(idx) {
      if (idx < 0 || idx >= state.shiftResults.length) return;
      if (!confirm('この記録を削除しますか？')) return;
      state.shiftResults.splice(idx, 1);
      saveState();
      renderHistoryPanel();
    }

    function clearHistory() {
      if (state.shiftResults.length === 0) return;
      if (!confirm('シフト履歴をすべて削除しますか？')) return;
      state.shiftResults = [];
      saveState();
      renderHistoryPanel();
    }

    // Event listeners
    document.getElementById('btnStart').addEventListener('click', startShift);
    document.getElementById('btnNextTurn').addEventListener('click', nextTurn);
    document.getElementById('btnEndShift').addEventListener('click', endShift);
    document.getElementById('btnReset').addEventListener('click', resetAll);
    document.getElementById('btnEvent').addEventListener('click', generateEvent);
    document.getElementById('btnRest').addEventListener('click', resetFatigue);
    document.getElementById('btnHistory').addEventListener('click', toggleHistory);
    document.getElementById('btnCloseHistory').addEventListener('click', toggleHistory);
    document.getElementById('btnClearHistory').addEventListener('click', clearHistory);
    document.getElementById('btnGoDecision').addEventListener('click', () => {
      if (!isDecisionPhase()) return;
      scrollToDecision();
    });
    document.getElementById('btnCloseNotice').addEventListener('click', () => {
      document.getElementById('notice').classList.add('hidden');
    });
    document.getElementById('decisionPanel').addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-action]');
      if (!btn || btn.disabled) return;
      const action = btn.getAttribute('data-action');
      if (action === 'select') {
        const id = btn.getAttribute('data-decision');
        if (Object.prototype.hasOwnProperty.call(DECISIONS, id)) {
          ui.selected = id;
          renderDecisionPanel();
        }
      } else if (action === 'confirm') {
        confirmDecision();
      } else if (action === 'cancel') {
        cancelDecision();
      }
    });

    // Initialize
    loadState();
    render();
  </script>
</body>
</html>
